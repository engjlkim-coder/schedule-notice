name: 공지 알림 발송

on:
  schedule:
    - cron: '*/5 * * * *'   # 5분마다 (GitHub 사정으로 몇 분 늦어질 수 있음)
  workflow_dispatch:         # Actions 탭에서 수동 실행(테스트)도 가능

concurrency:
  group: notify
  cancel-in-progress: false  # 겹쳐서 실행되어 같은 공지가 두 번 나가는 일을 방지

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: 의존성 설치
        run: npm ci --prefix scripts

      - name: 예약된 공지 발송
        run: node scripts/send.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
